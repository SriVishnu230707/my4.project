<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Depthboard — a premium spatial Kanban system.">
  <title>Depthboard — Spatial Kanban</title>
  <style>
    :root{--bg:#0c1018;--ink:#f6f8fb;--muted:#8f9aae;--line:rgba(255,255,255,.1);--panel:rgba(22,28,40,.72);--lime:#b6f36b;--cyan:#62dff2;--violet:#9c8cff;--shadow:0 26px 70px rgba(0,0,0,.36)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:500 15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 70% 4%,rgba(129,100,255,.18),transparent 30%),radial-gradient(circle at 8% 60%,rgba(99,228,235,.1),transparent 28%),linear-gradient(145deg,#0c1018,#111827)}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    button,input{font:inherit}.shell{width:min(1240px,calc(100% - 36px));margin:auto}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.03em}.logo{display:grid;place-items:center;width:33px;aspect-ratio:1;border-radius:10px;background:linear-gradient(145deg,#caff8b,#75dfa5);color:#101912;box-shadow:0 0 28px rgba(182,243,107,.28);transform:rotate(-6deg)}.meta{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px;background:rgba(255,255,255,.04)}
    .hero{padding:58px 0 48px;display:flex;align-items:end;justify-content:space-between;gap:30px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:.19em;font-size:11px;font-weight:900}.hero h1{font-size:clamp(52px,6.7vw,88px);letter-spacing:-.075em;line-height:.91;margin:17px 0}.hero h1 span{color:transparent;background:linear-gradient(100deg,#fff,var(--lime));background-clip:text}.hero p{color:var(--muted);font-size:17px;max-width:600px}.form{display:flex;gap:8px;padding:7px;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:min(430px,100%);backdrop-filter:blur(16px)}.form input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;padding:10px 11px}.form button{border:0;border-radius:11px;background:var(--lime);color:#14200f;padding:11px 16px;font-weight:850;cursor:pointer;box-shadow:0 10px 24px rgba(182,243,107,.17)}
    .board-wrap{padding-bottom:80px;perspective:1400px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;transform:rotateX(1.6deg);transform-origin:center top}.column{min-height:500px;border:1px solid var(--line);border-radius:24px;padding:15px;background:linear-gradient(160deg,rgba(25,31,45,.82),rgba(14,18,28,.73));box-shadow:var(--shadow);backdrop-filter:blur(18px)}.column:nth-child(2){transform:translateY(-12px)}.head{display:flex;align-items:center;justify-content:space-between;padding:7px 7px 16px}.label{display:flex;align-items:center;gap:9px;font-weight:850}.dot{width:9px;aspect-ratio:1;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan)}.column:nth-child(2) .dot{background:var(--violet);box-shadow:0 0 13px var(--violet)}.column:nth-child(3) .dot{background:var(--lime);box-shadow:0 0 13px var(--lime)}.count{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}.stack{display:grid;gap:11px}.task{position:relative;padding:17px 17px 16px;border:1px solid rgba(255,255,255,.11);border-radius:17px;background:linear-gradient(145deg,rgba(39,47,66,.94),rgba(23,29,42,.9));box-shadow:0 13px 24px rgba(0,0,0,.2);cursor:pointer;transition:.23s;transform-style:preserve-3d}.task:hover,.task:focus-visible{outline:0;transform:translateY(-5px) rotateX(2deg);border-color:rgba(182,243,107,.3);box-shadow:0 22px 35px rgba(0,0,0,.32)}.task b{display:block;font-size:15px;margin-bottom:20px}.task small{display:flex;justify-content:space-between;color:var(--muted)}.task small:after{content:"→";color:var(--lime)}.column:last-child .task small:after{content:"✓"}.priority{position:absolute;right:14px;top:14px;width:7px;aspect-ratio:1;border-radius:50%;background:#ff806f;box-shadow:0 0 10px rgba(255,128,111,.55)}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:17px}
    @media(max-width:900px){.hero{align-items:stretch;flex-direction:column}.board{grid-template-columns:1fr;transform:none}.column{min-height:220px}.column:nth-child(2){transform:none}}@media(max-width:520px){.shell{width:calc(100% - 24px)}.nav{height:70px}.hero{padding-top:40px}.hero h1{font-size:49px}.form{min-width:0;flex-direction:column}.form button{width:100%}.column{padding:12px;border-radius:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="shell nav"><div class="brand"><span class="logo">D</span>DEPTHBOARD</div><span class="meta">Spatial workflow · <span id="total">5</span> tasks</span></header>
  <main>
    <section class="shell hero"><div><div class="eyebrow">Work with dimension</div><h1>Make progress<br><span>feel tangible.</span></h1><p>A focused Kanban space where priorities rise, work moves, and progress becomes beautifully visible.</p></div><form class="form" id="form"><input id="input" required maxlength="80" placeholder="Add a task to the queue…"><button>Add task</button></form></section>
    <section class="shell board-wrap"><div class="board" id="board"></div><p class="hint">Click a card—or focus it and press Enter—to move it forward.</p></section>
  </main>
  <script>
    const seed=[{id:1,title:'Shape the product narrative',stage:0},{id:2,title:'Polish onboarding prototype',stage:0},{id:3,title:'Review motion system',stage:1},{id:4,title:'Validate mobile experience',stage:1},{id:5,title:'Define launch metrics',stage:2}];let tasks;try{tasks=JSON.parse(localStorage.getItem('depthboard-tasks'))||seed}catch{tasks=seed}
    const names=['Queue','In motion','Complete'],board=document.querySelector('#board'),total=document.querySelector('#total');
    function save(){localStorage.setItem('depthboard-tasks',JSON.stringify(tasks))}
    function advance(id){const task=tasks.find(t=>t.id===id);task.stage=(task.stage+1)%3;save();render()}
    function render(){board.replaceChildren();total.textContent=tasks.length;names.forEach((name,stage)=>{const col=document.createElement('section');col.className='column';const head=document.createElement('header');head.className='head';const label=document.createElement('span');label.className='label';const dot=document.createElement('i');dot.className='dot';label.append(dot,document.createTextNode(name));const count=document.createElement('span');count.className='count';count.textContent=tasks.filter(t=>t.stage===stage).length;head.append(label,count);const stack=document.createElement('div');stack.className='stack';tasks.filter(t=>t.stage===stage).forEach(t=>{const card=document.createElement('article');card.className='task';card.tabIndex=0;const title=document.createElement('b');title.textContent=t.title;const meta=document.createElement('small');meta.textContent=stage===2?'Complete':'Move forward';const p=document.createElement('i');p.className='priority';card.append(p,title,meta);card.onclick=()=>advance(t.id);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance(t.id)}};stack.append(card)});col.append(head,stack);board.append(col)})}
    document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#input'),title=input.value.trim();if(!title)return;tasks.unshift({id:Date.now(),title,stage:0});input.value='';save();render()};render();
  </script>
</body>
</html>
